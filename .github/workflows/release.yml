name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install skill-creator
      run: |
        # Clone OpenClaw to get skill-creator
        git clone --depth 1 https://github.com/openclaw/openclaw.git /tmp/openclaw
    
    - name: Package skill
      run: |
        python3 /tmp/openclaw/skills/skill-creator/scripts/package_skill.py . ./dist
    
    - name: Create Release
      uses: actions/create-release@v1
      id: create_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false
    
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/kimi-web-search.skill
        asset_name: kimi-web-search.skill
        asset_content_type: application/zip
